<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RJCS PYQ</title>

    <link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/navbar.css">
<link rel="stylesheet" href="../css/darkmode.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header style="display:flex; justify-content:space-between; align-items:center;padding:20px;">

        <!-- Left Side -->
        <div class="logo">

            <img src="../images/logo.png" alt="RJCS Logo">

            <h2>RJCS PYQ</h2>

        </div>

        <!-- Center -->
        <nav>
    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

        <!-- Right Side -->
        <div class="nav-right">

            <!-- Theme Toggle -->
            <div class="toggleWrapper">

    <input class="input" id="darkmode-toggle" type="checkbox">

    <label class="toggle" for="darkmode-toggle">

        <span class="toggle__handler">

            <span class="crater crater--1"></span>
            <span class="crater crater--2"></span>
            <span class="crater crater--3"></span>

        </span>

        <span class="star star--1"></span>
        <span class="star star--2"></span>
        <span class="star star--3"></span>
        <span class="star star--4"></span>
        <span class="star star--5"></span>
        <span class="star star--6"></span>

    </label>

</div>

            <!-- Profile -->
            <div class="profile">

                <div class="circle">
                    <span class="circle-inner">DC</span>
                </div>

            </div>

        </div>

    </header>

    <!-- Rest of website will come here -->

    <script src="js/script.js"></script>
    <script src="js/navbar.js"></script>
    <script src="../js/darkmode.js"></script>

</body>

</html>
