<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJCS-PYQ</title>
</head>
<body>

    <header>
        <h1>RJCS-PYQ</h1>
        <p>Intelligent Previous Year Question Retrieval System</p>
    </header>

    <main>
        <h2>Find Previous Year Questions</h2>

        <form>
            <label for="subject">Select Subject:</label>
            <select id="subject">
                <option value="">Select a subject</option>
                <option value="dbms">Database Management System</option>
                <option value="java">Java</option>
                <option value="data-structures">Data Structures</option>
                <option value="computer-networks">Computer Networks</option>
            </select>

            <br><br>

            <label for="topic">Enter Topic:</label>
            <input
                type="text"
                id="topic"
                placeholder="Example: Normalization"
            >

            <br><br>

            <button type="submit">Search PYQs</button>
        </form>
    </main>

    <footer>
        <p>RJCS-PYQ | Computer Science Previous Year Question Retrieval</p>
    </footer>

</body>
</html>
